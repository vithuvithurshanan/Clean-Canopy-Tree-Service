<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional tree trimming, removal, and stump grinding. Licensed and insured arborists serving residential and commercial properties. Free estimates." />
    <title>Clean Canopy Tree Service — Professional Tree Care</title>

    <!-- Preconnect for critical origins (max 4) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://link.kdlead.com" crossorigin />
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />

    <!-- Google Fonts loaded async to avoid render-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Neucha&family=Geist:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Neucha&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Preload hero image (LCP element) -->
    <link rel="preload" as="image" href="/opt_home.webp" type="image/webp" />

    <!-- Inline critical above-the-fold CSS -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{scroll-behavior:smooth}
      body{background-color:#edf5e9;color:#0f2d1a;font-family:system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
      h1,h2,h3{font-family:Georgia,serif;font-weight:400;color:#1a5c35;line-height:1.15}
      h1{font-size:clamp(2.4rem,5.5vw,4.5rem)}
      .nav{position:fixed;top:0;left:0;right:0;z-index:50;background:transparent;transition:background .3s ease;border-bottom:1px solid transparent}
      .nav-inner{max-width:1240px;margin:0 auto;padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
      .hero-fullscreen{position:relative;width:100%;height:100vh;min-height:600px;display:flex;align-items:center;justify-content:center;overflow:hidden}
      .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
      .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.55))}
      .hero-fullscreen-inner{position:relative;z-index:2;text-align:center;padding:2rem 1.5rem;max-width:820px;margin:0 auto}
      .hero-fullscreen-title{color:#fff;font-size:clamp(2.8rem,6vw,5.5rem);margin:.75rem 0 1.25rem;text-shadow:0 2px 20px rgba(0,0,0,.4);font-family:Georgia,serif;font-weight:400;line-height:1.15}
      .hero-fullscreen-sub{font-size:clamp(1rem,2vw,1.25rem);color:rgba(255,255,255,.9);max-width:580px;margin:0 auto 2.25rem;line-height:1.6}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.8rem;border-radius:32px;font-weight:600;font-size:.95rem;white-space:nowrap;text-decoration:none}
      .btn-accent{background-color:#1a7a40;color:#fff}
      .btn-white{background-color:#fff;color:#1a5c35}
      img{max-width:100%;display:block}
      a{color:inherit;text-decoration:none}
    </style>
    <!-- Google Tag Manager - deferred to not block render -->
    <script>
      window.addEventListener('load', function() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?l=dataLayer&id=G-Q3MB1E89RD';
        s.async = true;
        document.head.appendChild(s);
      });
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Q3MB1E89RD');
    </script>
  </head>
  <body>
    <!-- Static hero shell shown before React hydrates — eliminates LCP render delay -->
    <div id="root">
      <div class="hero hero-fullscreen" style="position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <div class="hero-bg" style="position:absolute;inset:0;background-image:url('/opt_home.webp');background-size:cover;background-position:center"></div>
        <div class="hero-overlay" style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.55))"></div>
        <div class="hero-fullscreen-inner" style="position:relative;z-index:2;text-align:center;padding:2rem 1.5rem;max-width:820px;margin:0 auto">
          <h1 class="hero-fullscreen-title" style="color:#fff;font-size:clamp(2.8rem,6vw,5.5rem);margin:.75rem 0 1.25rem;font-family:Georgia,serif;font-weight:400;line-height:1.15">Your trees deserve expert care</h1>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
